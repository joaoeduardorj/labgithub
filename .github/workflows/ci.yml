# Integração contínua: em cada PR e envio para main/developer, instala as dependências,
# roda os testes e confere se o projeto compila. Se algo falhar, o PR mostra um X vermelho.
name: CI

on:
  push:
    branches: [ "main", "developer" ]
  pull_request:
    branches: [ "main", "developer" ]

jobs:
  testar:
    name: Testes e build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Rodar os testes
        run: npm test

      - name: Compilar o projeto
        run: npm run build
